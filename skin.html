<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            font-size: 50px;

        .option{

        }
        input.option{

        }

<body>

          <input type="checkbox"name="1" class="option">Pores and acne <br>
          <input type="checkbox"name="1" class="option">oil control<br>
    </form>
</body>
</html>
